name: Fuzz

# The vault's parsers under libFuzzer (rust-service/fuzz; design §16.1): the
# document decoder, the setup-code parser, the statement parsers and the
# handoff payload opener. Its own workflow because cargo-fuzz needs a nightly
# toolchain, which nothing else in CI uses. Every pull request already replays
# the committed corpora in `make test-rust` (tests/vault_fuzz_corpus.rs); this
# job searches for new inputs.
#
# GitHub runs a schedule only from the default branch (main), while work merges
# to develop. So the nightly run checks out develop explicitly, and every push
# to develop that touches the vault runs the long budget too; until this file
# reaches main, those pushes are the only long runs.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "rust-service/src/vault/**"
      - "rust-service/fuzz/**"
      - "rust-service/Cargo.lock"
      - "rust-service/Cargo.toml"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths:
      - "rust-service/src/vault/**"
      - "rust-service/fuzz/**"
      - "rust-service/Cargo.lock"
      - "rust-service/Cargo.toml"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vault:
    name: Fuzz the vault parsers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      # Both pins live in the Makefile, next to the target that uses them.
      - name: Install the fuzzing toolchain and cargo-fuzz
        run: |
          toolchain="$(make -s print-fuzz-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal
          cargo +"$toolchain" install cargo-fuzz --version "$(make -s print-cargo-fuzz-version)" --locked

      - name: Cache cargo registry and the fuzz target directory
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust-service/fuzz

      # Ten minutes a target nightly and on a push to develop, one on a pull
      # request. A crash fails the job; libFuzzer prints the input inline only
      # when it is 256 bytes or less, so the next step keeps the crash files.
      - name: Run each target
        run: make fuzz-vault FUZZ_SECONDS=${{ github.event_name == 'pull_request' && '60' || '600' }}

      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-fuzz-artifacts
          path: rust-service/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
