[package]
name = "velvt-service"
version = "1.0.0"
edition = "2021"
publish = false
build = "build.rs"

[features]
default = []
onnx = ["dep:ort", "dep:tokenizers"]
test-helpers = []

[workspace]
members = [".", "shared-types"]
resolver = "2"

[dependencies]
# The four below are for src/vault (Sync v1). Each is already compiled into the
# default build through reqwest and rustls, at the version and features named
# here, so none adds a crate to Cargo.lock. Founder approval: design §17 Q4.
base64 = "0.22.1"
ring = "0.17.14"
subtle = { version = "2.6.1", default-features = false }
zeroize = "1.9.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
velvt-shared-types = { path = "shared-types" }
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-native", "api-24"] }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
