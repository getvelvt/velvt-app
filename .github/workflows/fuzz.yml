name: Fuzz

# The vault's parsers under libFuzzer (rust-service/fuzz; design §16.1): the
# document decoder, the setup-code parser, the statement parsers and the
# handoff payload opener. Its own workflow because cargo-fuzz needs a nightly
# toolchain, which nothing else in CI uses. Every pull request already replays
# the committed corpora in `make test-rust` (tests/vault_fuzz_corpus.rs); this
# job searches for new inputs.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "rust-service/src/vault/**"
      - "rust-service/fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vault:
    name: Fuzz the vault parsers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # Both pins live in the Makefile, next to the target that uses them.
      - name: Install the fuzzing toolchain and cargo-fuzz
        run: |
          toolchain="$(make -s print-fuzz-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal
          cargo +"$toolchain" install cargo-fuzz --version "$(make -s print-cargo-fuzz-version)" --locked

      - name: Cache cargo registry and the fuzz target directory
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust-service/fuzz

      # Ten minutes a target on the nightly schedule, one on a pull request.
      # A crash prints the input (libFuzzer's `Base64:` line) and fails the job.
      - name: Run each target
        run: make fuzz-vault FUZZ_SECONDS=${{ github.event_name == 'schedule' && '600' || '60' }}
